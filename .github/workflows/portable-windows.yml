name: Portable Windows build

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'skills/mmdbridge-card-manager/**'
      - '.github/workflows/portable-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri -- build --no-bundle
        working-directory: apps/desktop
      - name: Build AgentLink CLI
        run: cargo build --release --locked -p mmdbridge-cli
      - name: Prepare portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/MBL -Force | Out-Null
          Copy-Item -LiteralPath target/release/mmdbridge-desktop.exe -Destination artifacts/MBL/MMDbridgeLib.exe
          Copy-Item -LiteralPath target/release/mmdbridge.exe -Destination artifacts/MBL/mmdbridge.exe
          New-Item -ItemType Directory -Path artifacts/MBL/skills -Force | Out-Null
          Copy-Item -LiteralPath skills/mmdbridge-card-manager -Destination artifacts/MBL/skills/mmdbridge-card-manager -Recurse
          Get-Item artifacts/MBL/*.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: MBL-Portable-Windows
          path: artifacts/MBL
          if-no-files-found: error
