name: Character subject framing

on:
  push:
    branches: [main]
    paths:
      - 'crates/mmdbridge-core/src/thumbnail*'
      - 'crates/mmdbridge-core/examples/subject_framing_probe.rs'
      - 'scripts/subject-review.mjs'
      - '.github/workflows/subject-framing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare isolated software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers fonts-noto-cjk
          mkdir -m 700 "$RUNNER_TEMP/mbl-framing-xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/mbl-framing-xdg" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mbl-framing-target" >> "$GITHUB_ENV"
          echo "MBL_SUBJECT_REVIEW=$RUNNER_TEMP/mbl-subject-review" >> "$GITHUB_ENV"
          echo "MBL_PLAYWRIGHT_MODULE=$RUNNER_TEMP/mbl-browser-test/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Render current subject framing
        run: cargo run --locked -p mmdbridge-core --example subject_framing_probe -- "$MBL_SUBJECT_REVIEW"
      - uses: actions/checkout@v5
        with:
          ref: 03ae41203c436032180881c4e8b34b67622a80e8
          path: baseline
      - name: Build the previous renderer for the same source models
        run: cargo build --manifest-path baseline/Cargo.toml --locked -p mmdbridge-core --example render_thumbnail
      - name: Render comparison baseline
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['MBL_SUBJECT_REVIEW'])
          manifest = json.loads((output / 'manifest.json').read_text())
          for entry in manifest['entries']:
              result = subprocess.run([
                  str(pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'debug/examples/render_thumbnail'),
                  str(output / 'models' / entry['modelFile']),
                  str(output / 'before' / (entry['case'] + '.webp')),
              ], check=True, capture_output=True, text=True, timeout=120)
              entry['baselineReport'] = json.loads(result.stdout)
          manifest['sourceCommit'] = os.environ['GITHUB_SHA']
          (output / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Prepare isolated headless browser
        run: |
          mkdir -p "$RUNNER_TEMP/mbl-browser-test"
          npm install --prefix "$RUNNER_TEMP/mbl-browser-test" --no-save --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/mbl-browser-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify comparisons and capture current library
        run: node scripts/subject-review.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MBL-Subject-Framing
          path: ${{ env.MBL_SUBJECT_REVIEW }}
          if-no-files-found: warn
