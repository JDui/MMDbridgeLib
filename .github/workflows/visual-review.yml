name: Isolated visual review

on:
  push:
    branches: [main]
    paths:
      - 'scripts/visual-review*'
      - 'apps/desktop/src/App.tsx'
      - 'apps/desktop/src/libraryState.ts'
      - 'apps/desktop/src/theme.ts'
      - 'apps/desktop/src/AppearanceSettings.tsx'
      - 'crates/mmdbridge-core/**'
      - 'apps/desktop/src/**/*.css'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Install isolated browser test tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mbl-browser-test" --no-save --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/mbl-browser-test/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify recovery UI and capture stages
        env:
          MBL_PLAYWRIGHT_MODULE: ${{ runner.temp }}/mbl-browser-test/node_modules/playwright
          MBL_REVIEW_OUTPUT: ${{ runner.temp }}/mbl-visual-review
        run: node scripts/visual-review.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MBL-Visual-Recovery
          path: ${{ runner.temp }}/mbl-visual-review
          if-no-files-found: error
